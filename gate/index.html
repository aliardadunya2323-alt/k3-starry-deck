<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>星空甲板 · 受邀体验</title>
  <link rel="icon" href="assets/sigil-mini.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="invitation">
    <span class="eyebrow">K3 / AN INVITATION TO THE STARS</span>
    <img class="sigil" src="assets/sigil.svg" alt="" width="96" height="96">
    <p class="overline">夜航 · 互动作品</p>
    <h1>星空甲板</h1>
    <p class="intro">一艘船，一片星海。<br>欢迎登船，试试你的第一道魔法。</p>
    <form id="unlock">
      <label for="access-code">体验码</label>
      <input id="access-code" type="password" placeholder="输入收到的体验码" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="128" aria-describedby="status">
      <button id="enter" type="submit">进入甲板 <span aria-hidden="true">↗</span></button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">建议使用电脑浏览器 · 刷新后需重新输入</p>
    <noscript>请启用 JavaScript 后打开此体验。</noscript>
  </main>
  <footer>DESIGNED &amp; DIRECTED BY LC</footer>
  <script type="module" src="gate.js"></script>
</body>
</html>
